name: CI

# Pushes to main and v* tags run these tests through the Build workflow (build.yml), before packaging.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        env:
          OURTAIKOEDIT_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: dotnet test OurTaikoEdit.slnx
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
